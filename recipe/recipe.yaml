schema_version: 1

context:
  name: harlequin-postgres
  version: 1.4.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/harlequin_postgres-${{ version }}.tar.gz
  sha256: 1220d8e43e5c78e0479d400965d322482c483be19c45e37a1f8bbe8c861b32fe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - psycopg >=3.2,<4
    - harlequin >=2.11,<3
tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - harlequin_postgres

about:
  summary: A Harlequin adapter for Postgres.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/tconbeer/harlequin-postgres

extra:
  recipe-maintainers:
    - conda-forge/harlequin
